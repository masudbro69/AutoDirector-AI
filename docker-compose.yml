services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  engine:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache ffmpeg piper-tts || true; npm install; npm start"
    ports: ["8787:8787"]
    environment:
      OLLAMA_URL: http://ollama:11434
      COMFYUI_URL: http://host.docker.internal:8188
    volumes: ["./server:/app", "./storage:/app/storage"]
    depends_on: [ollama]
volumes: {ollama: {}}
